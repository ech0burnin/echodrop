# echodrop — пример конфигурации / sample configuration.
# Скопируй в echodrop.toml (cp echodrop.example.toml echodrop.toml) и правь под себя.
# Copy to echodrop.toml and adjust for your instance.
# Любое поле можно опустить — подставится дефолт, указанный в комментарии.
# Any field may be omitted — the default from the comment will be used.
#
# Переменные окружения бьют приоритетом над этим файлом (удобно для systemd/docker).
# Environment variables override this file (handy for systemd/docker).
# Полный список (все — опциональные) / full list (all optional):
#   ECHODROP_MODE, ECHODROP_LISTEN, ECHODROP_PORT (только порт / port only),
#   ECHODROP_STORAGE_PATH, ECHODROP_MAX_FILE_SIZE_MB,
#   ECHODROP_DEFAULT_TTL_HOURS, ECHODROP_MAX_TTL_HOURS,
#   ECHODROP_ALLOW_INFINITE_TTL, ECHODROP_TRACKING,
#   ECHODROP_SITE_NAME, ECHODROP_BASE_URL

# ── Режим работы (дефолт: free) / Site mode (default: free) ──
#   free   — только дропзона, без личных кабинетов / drop zone only, no accounts
#   open   — свободная регистрация пользователей / open user registration
#   closed — регистрация закрыта, вход только существующих / registration closed,
#            only existing users can sign in
mode = "free"

# Адрес, который слушает сервер: ip:port (дефолт: 0.0.0.0:8080).
# Порт можно переопределить отдельно переменной ECHODROP_PORT — IP сохранится.
# Listen address, ip:port (default: 0.0.0.0:8080).
# The port alone can be overridden via ECHODROP_PORT — the IP part stays.
listen = "0.0.0.0:8080"

# Каталог для загруженных файлов (дефолт: ./data, создаётся при старте).
# Внутри также лежит база echodrop.db (SQLite).
# Storage directory for uploaded files (default: ./data, created on start).
# The SQLite database echodrop.db also lives here.
storage_path = "./data"

# Максимальный размер файла в мегабайтах; больше — 413 (дефолт: 100).
# Max file size in megabytes; larger uploads get 413 (default: 100).
max_file_size_mb = 100

# Время жизни файла по умолчанию, в часах (дефолт: 168 = 7 суток).
# Default file lifetime in hours (default: 168 = 7 days).
# Пользователь может попросить другой срок при загрузке, но не дольше max_ttl_hours.
# Users may request another TTL at upload, capped by max_ttl_hours.
# 0 = «бессрочно по умолчанию» — допустимо только при allow_infinite_ttl = true.
# 0 = "infinite by default" — only valid with allow_infinite_ttl = true.
default_ttl_hours = 168

# Потолок срока хранения, который пользователь вправе попросить, часы
# (дефолт: 720 = 30 суток). Просьба дольше — 400.
# Upper bound for a user-requested TTL, hours (default: 720 = 30 days).
# Requests above it get 400.
# Значение обязано быть >= 1; при старте проверяется также, что
# default_ttl_hours <= max_ttl_hours.
# Must be >= 1; on start it is also checked that
# default_ttl_hours <= max_ttl_hours.
max_ttl_hours = 720

# Разрешить бессрочные файлы (ttl = 0 = никогда не истекает) — дефолт: false.
# Allow infinite-lifetime files (ttl = 0 = never expires) — default: false.
# При false запрос с ttl = 0 отклоняется (400), вечных файлов на инстансе нет.
# With false, ttl = 0 requests are rejected (400); no eternal files exist.
allow_infinite_ttl = false

# Трекинг связей файл-IP-fingerprint при загрузке И скачивании (дефолт: false).
# Track file-IP-fingerprint relations on upload AND download (default: false).
# true  — в БД пишется таблица events: кто (IP, отпечаток браузера) и когда
#         загружал/скачивал. Нужно для РКН-реальности: по запросу хостера/властей
#         владелец инстанса может дать координаты загрузившего гадость.
#         Отпечаток v1 = sha256(User-Agent + Accept-Language + Accept-Encoding).
# false — данные НЕ собираются вовсе: таблица events не создаётся.
# true  — an `events` table is written: who (IP, browser fingerprint) and when
#         uploaded/downloaded. For legal reality (e.g. RF regulators): on a lawful
#         request the instance owner can produce the uploader's coordinates.
#         Fingerprint v1 = sha256(User-Agent + Accept-Language + Accept-Encoding).
# false — no data collected at all: the events table is never created.
tracking = false

# Название сайта: шапка страниц и <title> (дефолт: echodrop).
# Site name: page headers and <title> (default: echodrop).
site_name = "echodrop"

# Публичный адрес сайта — из него строятся короткие ссылки на файлы
# (дефолт: http://localhost:8080; в проде https://files.example.com).
# Public site URL — short file links are built from it
# (default: http://localhost:8080; in production https://files.example.com).
base_url = "http://localhost:8080"
