<!doctype html>
<!-- echodrop dropzone: vanilla JS, без сборки. Темы dark/light (localStorage
     echodrop_theme), i18n ru/en (localStorage echodrop_lang, словарь /static/i18n.json).
     HTML-дефолты — русские, чтобы работало и без JS. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>echodrop</title>
<style>
  body {
    --bg: #111; --panel: #181818; --line: #2a2a2a; --txt: #eee; --dim: #888;
    --accent: #7aa2f7; --ok: #9ece6a; --err: #f7768e; --hover: #1a1f2e;
    background: var(--bg); color: var(--txt);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px; gap: 20px; margin: 0; min-height: 100vh;
  }
  body[data-theme='light'] {
    --bg: #f5f5f5; --panel: #fff; --line: #ddd; --txt: #111; --dim: #666; --hover: #e8eefc;
  }
  * { box-sizing: border-box; }
  header { text-align: center; }
  header h1 {
    margin: 0; font-weight: 600; letter-spacing: 3px; font-size: 28px;
  }
  header h1 img { height: 28px; vertical-align: middle; filter: invert(1); }
  body[data-theme='light'] header h1 img { filter: none; }
  header p { margin: 6px 0 0; color: var(--dim); font-size: 14px; }
  .switches { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
  .switches button {
    background: var(--panel); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer;
  }
  .switches button:hover { border-color: var(--accent); }

  #dropzone {
    width: 100%; max-width: 560px;
    border: 2px dashed var(--line); border-radius: 14px;
    padding: 48px 24px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #dropzone.hover { border-color: var(--accent); background: var(--hover); }
  #dropzone .big { font-size: 40px; margin-bottom: 8px; }
  #dropzone .hint { color: var(--dim); font-size: 13px; margin-top: 10px; }

  #controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    justify-content: center; font-size: 14px; color: var(--dim);
  }
  select, #pw {
    background: var(--panel); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 14px;
  }
  #pw { width: 120px; }

  #files { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 10px; }
  .row {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .row .name { font-size: 14px; word-break: break-all; }
  .row .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .bar {
    height: 6px; border-radius: 3px; background: var(--line);
    margin-top: 10px; overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0;
    background: var(--accent); transition: width .12s;
  }
  .row.done .bar i { background: var(--ok); }
  .row.fail .bar i { background: var(--err); }
  .link {
    display: flex; gap: 8px; align-items: center; margin-top: 10px;
  }
  .link a {
    color: var(--accent); font-size: 14px; word-break: break-all;
    text-decoration: none; flex: 1;
  }
  .link a:hover { text-decoration: underline; }
  button.copy {
    background: var(--panel); color: var(--txt);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  button.copy:hover { border-color: var(--accent); }
  .err { color: var(--err); font-size: 13px; margin-top: 8px; }
  .ttl-left { color: var(--dim); font-size: 12px; margin-left: 8px; }
  footer { color: var(--dim); font-size: 12px; margin-top: auto; }
</style>
</head>
<body>
<script>document.body.dataset.theme = localStorage.getItem('echodrop_theme') === 'light' ? 'light' : 'dark';</script>
<header>
  <h1><img src="/static/logo.svg" alt=""> echodrop</h1>
  <p data-i18n="tagline">уронил файл — забрал ссылку</p>
  <div class="switches">
    <button id="themeBtn" title="theme">🌙</button>
    <button id="langBtn">RU</button>
  </div>
</header>

<div id="dropzone" role="button" tabindex="0" aria-label="Загрузить файлы" data-i18n-aria="aria_upload">
  <div class="big">⬇</div>
  <div data-i18n="drop_hint">Перетащи файлы сюда или кликни</div>
  <div class="hint" data-i18n="drop_sub">файлы живут ограниченное время, потом стираются</div>
</div>
<input type="file" id="picker" multiple hidden>

<div id="controls">
  <label for="ttl" data-i18n="ttl_label">жизнь файла:</label>
  <select id="ttl"></select>
  <label for="pw" data-i18n="pw_label">пароль:</label>
  <input type="password" id="pw" placeholder="необязательно" autocomplete="off" data-i18n-ph="pw_ph">
</div>
<div id="state-line" class="hint"></div>

<div id="files"></div>

<div id="tracking-note" class="hint" hidden data-i18n="tracking_note">сервер фиксирует посещения (IP, время)</div>
<footer data-i18n="footer">echodrop · файлы не индексируются и умирают сами</footer>

<script>
'use strict';
const dz = document.getElementById('dropzone');
const picker = document.getElementById('picker');
const ttlSel = document.getElementById('ttl');
const pwInput = document.getElementById('pw');
const list = document.getElementById('files');

// --- i18n ---
let LANG = localStorage.getItem('echodrop_lang') ||
  ((navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en');
let DICT = null;
function t(k, fallback) {
  if (DICT && DICT[LANG] && DICT[LANG][k] !== undefined) return DICT[LANG][k];
  return fallback;
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const v = t(el.dataset.i18n, el.textContent);
    if (v) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => {
    const v = t(el.dataset.i18nPh, el.placeholder);
    if (v !== undefined) el.placeholder = v;
  });
  document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
    const v = t(el.dataset.i18nAria, el.getAttribute('aria-label'));
    if (v) el.setAttribute('aria-label', v);
  });
  document.documentElement.lang = LANG;
  const lb = document.getElementById('langBtn');
  if (lb) lb.textContent = LANG.toUpperCase();
}
fetch('/static/i18n.json').then((r) => r.json()).then((d) => {
  DICT = d; applyI18n(); buildTtlOptions(); applyStateLine();
}).catch(() => {});
document.getElementById('langBtn').addEventListener('click', () => {
  LANG = LANG === 'ru' ? 'en' : 'ru';
  localStorage.setItem('echodrop_lang', LANG);
  // перерисовка живых подписей и опций TTL на новом языке,
  // выбранный TTL сохраняем, если он есть в новом списке
  const keepTtl = ttlSel.value;
  applyI18n();
  buildTtlOptions();
  if (keepTtl && Array.from(ttlSel.options).some((o) => o.value === keepTtl)) {
    ttlSel.value = keepTtl;
  }
  applyStateLine();
});

// --- конфиг сервера ---
let CFG = null;
fetch('/config.json').then((r) => r.json()).then((c) => {
  CFG = c;
  buildTtlOptions();
  applyStateLine();
  const tn = document.getElementById('tracking-note');
  if (tn && c.tracking) tn.hidden = false;
}).catch(() => { buildTtlOptions(); applyStateLine(); });

function pluralRu(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function humanTtl(h) {
  if (h === 0) return t('forever', 'бессрочно');
  const ru = LANG === 'ru';
  if (h % 24 === 0) {
    const d = h / 24;
    return ru ? d + ' ' + pluralRu(d, 'день', 'дня', 'дней') : (d === 1 ? '1 day' : d + ' days');
  }
  return ru ? h + ' ' + pluralRu(h, 'час', 'часа', 'часов') : (h === 1 ? '1 hour' : h + ' hours');
}
function buildTtlOptions() {
  const max = (CFG && CFG.max_ttl_hours) || 720;
  const inf = !!(CFG && CFG.allow_infinite_ttl);
  const def = (CFG && CFG.default_ttl_hours) || 24;
  let opts = [1, 24, 168, 720].filter((h) => h <= max);
  if (max > 720) opts.push(max);
  if (inf) opts.push(0);
  if (!opts.length) opts = [Math.max(1, Math.min(max, def))];
  ttlSel.innerHTML = '';
  opts.forEach((h) => {
    const o = document.createElement('option');
    o.value = String(h);
    o.textContent = humanTtl(h);
    ttlSel.appendChild(o);
  });
  let best = opts[0];
  opts.forEach((h) => { if (h !== 0 && h <= def) best = h; });
  if (def === 0 && inf) best = 0;
  ttlSel.value = String(best);
}
function applyStateLine() {
  const el = document.getElementById('state-line');
  if (!el) return;
  const h = parseInt(ttlSel.value, 10) || 0;
  const tpl = (pwInput && pwInput.value)
    ? t('state_protected', 'файлы, загруженные сейчас, будут жить {ttl} и защищены паролем на скачивание')
    : t('state_open', 'файлы, загруженные сейчас, будут жить {ttl} и могут быть скачаны любым человеком по ссылке, без пароля');
  el.textContent = tpl.replace('{ttl}', humanTtl(h));
}
ttlSel.addEventListener('change', applyStateLine);
pwInput.addEventListener('input', applyStateLine);

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy') ? resolve() : reject(new Error('copy failed')); }
    catch (e) { reject(e); }
    finally { ta.remove(); }
  });
}

// --- тема: dark <-> light (бинарная; в localStorage мог остаться auto со старых версий) ---
const themeBtn = document.getElementById('themeBtn');
function curTheme() { return document.body.dataset.theme === 'light' ? 'light' : 'dark'; }
function setThemeIcon() { themeBtn.textContent = curTheme() === 'dark' ? '🌙' : '☀'; }
setThemeIcon();
themeBtn.addEventListener('click', () => {
  const next = curTheme() === 'dark' ? 'light' : 'dark';
  document.body.dataset.theme = next;
  localStorage.setItem('echodrop_theme', next);
  setThemeIcon();
});

// --- загрузка ---
// Загрузка строго по одному: спокойнее и серверу, и прогресс-барам.
let chain = Promise.resolve();

function humanSize(n) {
  const byteWord = t('byte', ' Б');
  const units = (DICT && DICT[LANG] && DICT[LANG].units) || ['КБ', 'МБ', 'ГБ'];
  if (n < 1024) return n + byteWord;
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
  return n.toFixed(n >= 10 ? 0 : 1) + ' ' + units[i];
}

function rowFor(file) {
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML =
    '<div class="name"></div>' +
    '<div class="meta"></div>' +
    '<div class="bar"><i></i></div>';
  el.querySelector('.name').textContent = file.name;
  el.querySelector('.meta').textContent = humanSize(file.size);
  list.prepend(el);
  return el;
}

function upload(file) {
  const el = rowFor(file);
  const fill = el.querySelector('.bar i');
  return new Promise((resolve) => {
    const fd = new FormData();
    fd.append('ttl_hours', ttlSel.value);
    // пароль ДО 'file': поле file завершает приём multipart на сервере
    if (pwInput && pwInput.value) fd.append('password', pwInput.value);
    fd.append('file', file, file.name);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + '%';
    };
    xhr.onload = () => {
      try {
        const json = JSON.parse(xhr.responseText);
        if (xhr.status === 200 && json.url) {
          fill.style.width = '100%';
          el.classList.add('done');
          const box = document.createElement('div');
          box.className = 'link';
          const a = document.createElement('a');
          a.href = json.url; a.textContent = json.url;
          const btn = document.createElement('button');
          btn.className = 'copy'; btn.textContent = t('copy', 'копировать');
          btn.onclick = () => {
            copyText(json.url)
              .then(() => { btn.textContent = t('ok', 'ок'); setTimeout(() => { btn.textContent = t('copy', 'копировать'); }, 1200); })
              .catch(() => { window.prompt(t('copy_manual', 'скопируй вручную:'), json.url); });
          };
          const left = document.createElement('span');
          left.className = 'ttl-left';
          const loc = LANG === 'ru' ? 'ru-RU' : 'en-GB';
          if (json.expires_at) {
            left.textContent = t('until', 'до ') + new Date(json.expires_at * 1000).toLocaleString(loc);
          } else {
            left.textContent = t('forever', 'бессрочно');
          }
          if (json.has_password) {
            const lock = document.createElement('span');
            lock.className = 'ttl-left';
            lock.textContent = '🔒 ' + t('locked', 'под паролем');
            box.append(a, btn, left, lock);
          } else {
            box.append(a, btn, left);
          }
          el.appendChild(box);
        } else {
          throw new Error(json.error || ('HTTP ' + xhr.status));
        }
      } catch (err) {
        el.classList.add('fail');
        fill.style.width = '100%';
        const e = document.createElement('div');
        e.className = 'err';
        e.textContent = String(err.message || err);
        el.appendChild(e);
      }
      resolve();
    };
    xhr.onerror = () => {
      el.classList.add('fail');
      fill.style.width = '100%';
      const e = document.createElement('div');
      e.className = 'err';
      e.textContent = t('net_err', 'сеть недоступна');
      el.appendChild(e);
      resolve();
    };
    xhr.send(fd);
  });
}

function enqueue(files) {
  for (const f of files) {
    chain = chain.then(() => upload(f));
  }
}

dz.addEventListener('click', () => picker.click());
dz.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') picker.click(); });
picker.addEventListener('change', () => { enqueue(picker.files); picker.value = ''; });

['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => {
  e.preventDefault(); dz.classList.add('hover');
}));
['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => {
  e.preventDefault(); dz.classList.remove('hover');
}));
dz.addEventListener('drop', (e) => { enqueue(e.dataTransfer.files); });
</script>
</body>
</html>
