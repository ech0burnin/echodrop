<!doctype html>
<!-- echodrop dropzone: vanilla JS, без сборки. Тёмная тема, drag&drop,
     мультизагрузка, прогресс, копирование ссылок. TTL-селектор -> ttl_hours. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>echodrop</title>
<style>
  :root {
    --bg: #111; --panel: #181818; --line: #2a2a2a; --txt: #eee; --dim: #888;
    --accent: #7aa2f7; --ok: #9ece6a; --err: #f7768e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--txt);
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 16px; gap: 20px;
  }
  header { text-align: center; }
  header h1 {
    margin: 0; font-weight: 600; letter-spacing: 3px; font-size: 28px;
  }
  header p { margin: 6px 0 0; color: var(--dim); font-size: 14px; }

  #dropzone {
    width: 100%; max-width: 560px;
    border: 2px dashed var(--line); border-radius: 14px;
    padding: 48px 24px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #dropzone.hover { border-color: var(--accent); background: #1a1f2e; }
  #dropzone .big { font-size: 40px; margin-bottom: 8px; }
  #dropzone .hint { color: var(--dim); font-size: 13px; margin-top: 10px; }

  #controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    justify-content: center; font-size: 14px; color: var(--dim);
  }
  select {
    background: var(--panel); color: var(--txt); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font-size: 14px;
  }

  #files { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 10px; }
  .row {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px;
  }
  .row .name { font-size: 14px; word-break: break-all; }
  .row .meta { color: var(--dim); font-size: 12px; margin-top: 2px; }
  .bar {
    height: 6px; border-radius: 3px; background: var(--line);
    margin-top: 10px; overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 0;
    background: var(--accent); transition: width .12s;
  }
  .row.done .bar i { background: var(--ok); }
  .row.fail .bar i { background: var(--err); }
  .link {
    display: flex; gap: 8px; align-items: center; margin-top: 10px;
  }
  .link a {
    color: var(--accent); font-size: 14px; word-break: break-all;
    text-decoration: none; flex: 1;
  }
  .link a:hover { text-decoration: underline; }
  button.copy {
    background: var(--panel); color: var(--txt);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  button.copy:hover { border-color: var(--accent); }
  .err { color: var(--err); font-size: 13px; margin-top: 8px; }
  .ttl-left { color: var(--dim); font-size: 12px; margin-left: 8px; }
  footer { color: var(--dim); font-size: 12px; margin-top: auto; }
</style>
</head>
<body>
<header>
  <h1><img src="/static/logo.svg" alt="" style="height:28px;vertical-align:middle;filter:invert(1)"> echodrop</h1>
  <p>уронил файл — забрал ссылку</p>
</header>

<div id="dropzone" role="button" tabindex="0" aria-label="Загрузить файлы">
  <div class="big">⬇</div>
  <div>Перетащи файлы сюда или кликни</div>
  <div class="hint">файлы живут ограниченное время, потом стираются</div>
</div>
<input type="file" id="picker" multiple hidden>

<div id="controls">
  <label for="ttl">жизнь файла:</label>
  <select id="ttl">
    <option value="1">1 час</option>
    <option value="24" selected>1 день</option>
    <option value="168">7 дней</option>
    <option value="720">30 дней</option>
  </select>
  <label for="pw">пароль:</label>
  <input type="password" id="pw" placeholder="необязательно" autocomplete="off"
         style="background:#181818;color:#eee;border:1px solid #2a2a2a;border-radius:8px;padding:6px 10px;font-size:14px;width:120px">
</div>

<div id="files"></div>

<footer>echodrop · файлы не индексируются и умирают сами</footer>

<script>
'use strict';
const dz = document.getElementById('dropzone');
const picker = document.getElementById('picker');
const ttlSel = document.getElementById('ttl');
const pwInput = document.getElementById('pw');
const list = document.getElementById('files');

// Загрузка строго по одному: спокойнее и серверу, и прогресс-барам.
let chain = Promise.resolve();

function humanSize(n) {
  if (n < 1024) return n + ' Б';
  const units = ['КБ', 'МБ', 'ГБ'];
  let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < units.length - 1);
  return n.toFixed(n >= 10 ? 0 : 1) + ' ' + units[i];
}

function rowFor(file) {
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML =
    '<div class="name"></div>' +
    '<div class="meta"></div>' +
    '<div class="bar"><i></i></div>';
  el.querySelector('.name').textContent = file.name;
  el.querySelector('.meta').textContent = humanSize(file.size);
  list.prepend(el);
  return el;
}

function upload(file) {
  const el = rowFor(file);
  const fill = el.querySelector('.bar i');
  return new Promise((resolve) => {
    const fd = new FormData();
    fd.append('ttl_hours', ttlSel.value);
    // пароль ДО 'file': поле file завершает приём multipart на сервере
    if (pwInput && pwInput.value) fd.append('password', pwInput.value);
    fd.append('file', file, file.name);
    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload');
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) fill.style.width = (e.loaded / e.total * 100) + '%';
    };
    xhr.onload = () => {
      try {
        const json = JSON.parse(xhr.responseText);
        if (xhr.status === 200 && json.url) {
          fill.style.width = '100%';
          el.classList.add('done');
          const box = document.createElement('div');
          box.className = 'link';
          const a = document.createElement('a');
          a.href = json.url; a.textContent = json.url;
          const btn = document.createElement('button');
          btn.className = 'copy'; btn.textContent = 'копировать';
          btn.onclick = () => {
            (navigator.clipboard ? navigator.clipboard.writeText(json.url) : Promise.reject())
              .then(() => { btn.textContent = 'ок'; setTimeout(() => btn.textContent = 'копировать', 1200); })
              .catch(() => { prompt('Скопируй вручную:', json.url); });
          };
          const left = document.createElement('span');
          left.className = 'ttl-left';
          const until = new Date((json.expires_at || 0) * 1000);
          left.textContent = 'до ' + until.toLocaleString('ru-RU');
          box.append(a, btn, left);
          el.appendChild(box);
        } else {
          throw new Error(json.error || ('HTTP ' + xhr.status));
        }
      } catch (err) {
        el.classList.add('fail');
        fill.style.width = '100%';
        const e = document.createElement('div');
        e.className = 'err';
        e.textContent = String(err.message || err);
        el.appendChild(e);
      }
      resolve();
    };
    xhr.onerror = () => {
      el.classList.add('fail');
      fill.style.width = '100%';
      const e = document.createElement('div');
      e.className = 'err';
      e.textContent = 'сеть недоступна';
      el.appendChild(e);
      resolve();
    };
    xhr.send(fd);
  });
}

function enqueue(files) {
  for (const f of files) {
    chain = chain.then(() => upload(f));
  }
}

dz.addEventListener('click', () => picker.click());
dz.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') picker.click(); });
picker.addEventListener('change', () => { enqueue(picker.files); picker.value = ''; });

['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => {
  e.preventDefault(); dz.classList.add('hover');
}));
['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => {
  e.preventDefault(); dz.classList.remove('hover');
}));
dz.addEventListener('drop', (e) => { enqueue(e.dataTransfer.files); });
</script>
</body>
</html>
